- type: entity
  abstract: true
  parent: BaseItem
  id: BaseMagazineBox545Rifle
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - N14Cartridge545Rifle
    proto: N14Cartridge545Rifle
    capacity: 75
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: Corvax/Objects/Weapons/Guns/Ammunition/Boxes/5-45box.rsi
    netsync: false
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance
  - type: FoldableAmmoBox #Misfits Change /Add/: Empty cardboard ammo boxes can fold back into one cardboard sheet.

- type: entity
  parent: BaseMagazineBox545Rifle
  id: MagazineBox545
  suffix: Deprecated
  name: ammunition box (5.45mm)
  components:
  - type: BallisticAmmoProvider
    proto: N14Cartridge545Rifle
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

# #Misfits Add - 5mm ammunition box. 5.45mm is deprecated; the AK-112, assault carbine and minigun all fire 5mm.
- type: entity
  parent: BaseMagazineBox545Rifle
  id: N14MagazineBox5mm
  name: ammunition box (5mm)
  components:
  - type: BallisticAmmoProvider
    whitelist:
      tags:
        - N14CartridgePistol5
    proto: N14CartridgePistol5
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
