- type: entity
  name: Ak-112
  parent: N14WeaponRifleBase
  id: N14WeaponRifleAk112
  description: AK-112 assault rifle. An old military model that has not been used since the war. It fires in single-shot and automatic modes. It has gained popularity among the Western Brotherhood of Steel. It uses 5mm cartridges and accepts standard and drum magazines.
  components:
